services:
  db:
    image: pgvector/pgvector:pg17
    container_name: ctxdb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctx
      POSTGRES_PASSWORD: ctx
      POSTGRES_DB: ctxdb
    ports:
      # 5433 on host so it never clashes with a local postgres on 5432
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs only on first init of an empty volume
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctx -d ctxdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  embed:
    # Shared embedding server. One model in memory, all MCP client processes use it.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    container_name: ctxdb-embed
    restart: unless-stopped
    command:
      - --model-id=BAAI/bge-m3
      - --pooling=cls
      - --max-client-batch-size=64
      # Both flags exist to cap idle RAM, and both were measured on this stack.
      # The ONNX backend sizes its CPU arena on the warmup batch and never
      # returns it, so the default --max-batch-tokens=16384 against a model with
      # an 8192-token limit parks ~16 GB before a single request arrives.
      # Chunks are 200 tokens, so 2048 is 10x headroom; it is a scheduler hint,
      # not a reject -- a larger single input still embeds (auto-truncate).
      - --max-batch-tokens=2048
      # One tokenizer copy per worker, and bge-m3's is a 250k-vocab sentencepiece
      # (~92 MB each). Defaults to one per core. Embedding is inference-bound
      # here -- 64 chunks took 7.6s on 31 workers and 7.5s on 4.
      - --tokenization-workers=4
    ports:
      - "127.0.0.1:8085:80"
    volumes:
      # model weights cached here, downloaded once on first start (~2.2 GB)
      - hfcache:/data

volumes:
  pgdata:
  hfcache:
