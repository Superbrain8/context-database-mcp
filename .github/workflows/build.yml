name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Needed by the tagged-release step; the default token is read-only.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: context-database-mcp.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: context-database-mcp

    steps:
      # v5 on both actions below. That clears the Node 20 deprecation
      # annotation for checkout; upload-artifact@v5 still ships a Node 20
      # manifest, so its annotation stays until upstream bumps it.
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Warnings are errors here: the crate builds clean today, and a warning
      # that lands on main is one nobody reads afterwards.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The unit tests cover chunking and transcript parsing only -- neither
      # Postgres nor the embedder is reachable from CI, and everything that
      # needs them is exercised by hand against the local Docker stack.
      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v5
        with:
          name: context-database-mcp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          if-no-files-found: error

      # Tagged pushes additionally publish the binaries, so a machine that has
      # no Rust toolchain can still run the server and the hooks.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/${{ matrix.bin }}
          fail_on_unmatched_files: true
